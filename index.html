<body>
<p>Opening <a id="appLink" href="v16.html">Woods Team Hub</a>…</p>
<script>
(() => {
  // Keep one stable public entry point. Preserve auth/recovery parameters and
  // fragments so a Supabase callback cannot be lost while entering the app.
  const target = new URL('v16.html', window.location.href);
  target.search = window.location.search;
  target.hash = window.location.hash;
  document.getElementById('appLink').href = target.href;
  window.location.replace(target.href);
})();
</script>
