<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Woods COGS Test</title><style>:root{--g:#58705b;--d:#263d2c;--c:#f7f4ec;--l:#d8dfd8}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--d);font:15px system-ui,sans-serif}header{padding:18px 22px;background:var(--g);color:#fff}header b{font-size:20px}main{max-width:1180px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,var(--d),var(--g));color:#fff;border-radius:18px;padding:22px;margin-bottom:15px}.hero h1{margin:0 0 5px}.hero p{margin:0}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpis div,.cards article{background:#fff;border:1px solid var(--l);border-radius:14px;padding:15px}.kpis b{display:block;font-size:24px}.kpis small,.note,.cards p{color:#68766c}nav{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}button{border:1px solid var(--l);background:#fff;color:var(--d);padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer}.primary,nav button:first-child{background:var(--g);color:#fff}.table{overflow:auto;background:#fff;border:1px solid var(--l);border-radius:14px;margin-top:10px}table{border-collapse:collapse;width:100%;min-width:800px}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left}input,select{border:1px solid var(--l);border-radius:8px;padding:8px;max-width:120px}.status{padding:5px 8px;border-radius:99px;font-size:12px;font-weight:700}.ontarget{background:#e3f4e9;color:#17633a}.watch{background:#fff0c2}.high{background:#fee4e2;color:#8a1c13}.needscosting{background:#edf0ee}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.row{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin:8px 0}.row select,.row input{max-width:none;width:100%}dialog{border:0;border-radius:16px;padding:20px;max-width:650px;width:92%;color:var(--d)}dialog::backdrop{background:#0007}@media(max-width:600px){.kpis{grid-template-columns:
