<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Woods COGS Test</title><style>:root{--ink:#263d2c;--green:#5b725d;--dark:#405643;--cream:#f8f5ed;--line:#d8dfd8;--muted:#667369}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 system-ui,sans-serif}header{background:var(--green);color:white;padding:18px 22px}header h1{margin:0;font-size:1.35rem}main{max-width:1180px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,var(--ink),var(--green));color:#fff;padding:22px;border-radius:18px;margin-bottom:16px}.hero h2{margin:0 0 4px}.hero p{margin:0}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:white}.cogs-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.cogs-kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.cogs-kpi small,.category,.notes{color:var(--muted)}.cogs-kpi strong{display:block;font-size:1.5rem}.cogs-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.cogs-table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.cogs-table{border-collapse:collapse;width:100%;min-width:800px}.cogs-table th,.cogs-table td{padding:11px;border-bottom:1px solid var(--line);text-align:left}.cogs-price,input,select{min-height:40px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff}.cogs-price{width:95px}.cogs-status{padding:5px 8px;border-radius:999px;font-weight:700;font-size:.8rem}.cogs-status.good{background:#e5f4eb;color:#17633a}.cogs-status.watch{background:#fff0c2;color:#70530e}.cogs-status.high{background:#fee4e2;color:#8a1c13}.cogs-status.incomplete{background:#eef1ef;color:#66756f}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220p
