<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b725d">
<title>Woods Team Hub · Staffing</title>
<link rel="icon" href="woods-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#263d2c;--green:#5b725d;--dark:#405643;--cream:#f8f5ed;--paper:#fff;--line:#d8dfd8;--muted:#667369;--pale:#edf1ed;--red:#b42318;--gold:#dfaf3f;--shadow:0 10px 28px rgba(50,72,53,.12)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 Poppins,system-ui,sans-serif}.shell{max-width:1050px;margin:auto;min-height:100vh}header{position:sticky;top:0;z-index:10;background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 18px rgba(38,61,44,.2)}header b{font-size:18px}.home{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.55);border-radius:10px;padding:8px 10px;font-weight:700;white-space:nowrap}main{padding:16px}.hero{background:linear-gradient(135deg,var(--ink),var(--green));color:#fff;border-radius:18px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 4px;font-size:26px}.hero p{margin:0;color:#e5eee7}.sync{font-size:12px;margin-top:8px;color:#e6efe8}.toolbar{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;margin:12px 0}.toolbar h2{text-align:center;margin:0;font-size:20px}button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;min-height:42px;padding:8px 12px;font-weight:700;cursor:pointer}.primary{background:var(--green);border-color:var(--green);color:#fff}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.weekdays div{text-align:center;color:var(--muted);font-size:12px;font-weight:800;padding:5px}.day{position:relative;min-height:105px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px;text-align:left;box-shadow:0 3px 10px rgba(50,72,53,.06);cursor:pointer}.day.other{opacity:.38}.day.today{outline:2px solid var(--green)}.day.closed{background:#f2f2ef}.daynum{font-weight:800;font-size:16px}.daystatus{display:block;margin-top:8px;font-size:11px;line-height:1.35;color:var(--muted)}.closed .daystatus{color:var(--red);font-weight:800}.opener{display:block;color:var(--green);font-weight:700;margin-top:3px}.dot{position:absolute;right:8px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--green)}.closed .dot{background:var(--red)}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 2px;color:var(--muted);font-size:12px}.legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px}.legend .lc::before{background:var(--red)}dialog{border:0;border-radius:18px;width:min(620px,96%);max-height:90dvh;padding:0;color:var(--ink);box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0007}.editor-head{position:sticky;top:0;background:var(--green);color:#fff;padding:16px 18px;z-index:2}.editor-head h2{margin:0;font-size:20px}.editor-head small{color:#e4ede6}.editor-body{padding:16px}.closed-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff5f3;border:1px solid #efd0cc;border-radius:13px;padding:12px 14px;margin-bottom:14px;font-weight:800}.closed-toggle input,.person input{width:21px;height:21px;accent-color:var(--green)}.group{margin:14px 0}.group h3{margin:0 0 7px;font-size:14px;color:var(--green);text-transform:uppercase;letter-spacing:.04em}.person{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:6px 0}.person-name{font-weight:700}.ticklabel{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:700}.openpick{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-size:12px;min-height:auto}.openpick.active{background:var(--green);color:#fff;border-color:var(--green)}.staff-area.disabled{opacity:.35;pointer-events:none}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px}.field textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;position:sticky;bottom:-16px;background:var(--cream);padding:12px 0 4px}.setup{background:#fff8df;border-left:5px solid var(--gold);border-radius:12px;padding:14px;margin:12px 0}.setup a{color:var(--dark);font-weight:800}.empty{text-align:center;background:#fff;border:1px dashed var(--line);border-radius:14px;padding:28px;color:var(--muted)}@media(max-width:700px){main{padding:10px}.hero{padding:16px}.hero h1{font-size:22px}.toolbar{grid-template-columns:auto 1fr auto}.toolbar .todaybtn{grid-column:1/-1}.weekdays,.calendar{gap:4px}.weekdays div{font-size:10px}.day{min-height:82px;border-radius:10px;padding:6px}.daynum{font-size:14px}.daystatus{font-size:9px;margin-top:5px}.opener{font-size:9px}.dot{right:5px;top:6px}.person{grid-template-columns:1fr auto auto;padding:9px}.ticklabel span{display:none}}@media(max-width:390px){header b{font-size:15px}.home{font-size:12px}.day{min-height:72px}.daystatus{line-height:1.2}.toolbar h2{font-size:17px}}
</style></head>
<body><div class="shell"><header><b>Woods Team Hub · Staffing</b><a class="home" href="v16.html">⌂ Team Hub</a></header><main><section class="hero"><h1>Staffing Calendar</h1><p>Plan each day’s team, opening responsibility and shop closures.</p><div id="sync" class="sync">Connecting…</div></section><div id="setup"></div><div class="toolbar"><button id="prev" aria-label="Previous month">‹</button><h2 id="monthTitle"></h2><button id="next" aria-label="Next month">›</button><button id="today" class="todaybtn">Today</button></div><div class="weekdays"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div><div id="calendar" class="calendar"></div><div class="legend"><span>Staffing saved</span><span class="lc">Shop closed</span></div></main></div>
<dialog id="editor"><div class="editor-head"><h2 id="editTitle"></h2><small id="editSubtitle">Select who is working and who opens up.</small></div><div class="editor-body"><label class="closed-toggle"><span>Shop closed</span><input id="closed" type="checkbox"></label><div id="staffArea" class="staff-area"></div><div class="field"><label for="notes">Shift notes (optional)</label><textarea id="notes" placeholder="Anything Lou or the team need to know…"></textarea></div><div class="actions"><button id="cancel">Cancel</button><button id="save" class="primary">Save day</button></div></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=7"></script>
<script>
const GROUPS=[['Chefs',['Ellen','Hope']],['Front of house',['Lou','Sonna','Emily','Andreaa','Tina','Beth']],['Pot wash',['Alfie','Lilly','Riley','Grace']]];
const cfg=window.WOODS_CONFIG||{};const db=window.supabase?.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);let user=null,rows=new Map(),cursor=new Date(),editingDate='',draftOpener='';cursor.setDate(1);
const $=s=>document.querySelector(s);const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};const pretty=s=>new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(s+'T12:00:00'));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function monthRange(){const a=new Date(cursor.getFullYear(),cursor.getMonth(),1),b=new Date(cursor.getFullYear(),cursor.getMonth()+1,0);return[iso(a),iso(b)]}
async function loadMonth(){if(!db||!user)return;const[a,b]=monthRange();$('#sync').textContent='Loading shared staffing…';const q=await db.from('shop_staffing').select('*').gte('shift_date',a).lte('shift_date',b);if(q.error){$('#sync').textContent='Staffing setup required';$('#setup').innerHTML=`<div class="setup"><strong>One-time setup needed.</strong><br>Run <code>supabase-staffing.sql</code> in the <a href="https://supabase.com/dashboard/project/ypquqxolphrocdohcrrg/sql/new" target="_blank" rel="noopener">Supabase SQL Editor</a>, then refresh this page.</div>`;rows.clear();render();return}$('#setup').innerHTML='';rows=new Map((q.data||[]).map(x=>[x.shift_date,x]));$('#sync').textContent='Shared staffing connected';render()}
function render(){const y=cursor.getFullYear(),m=cursor.getMonth();$('#monthTitle').textContent=new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric'}).format(cursor);const first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7)),today=iso(new Date());let html='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=iso(d),r=rows.get(key),other=d.getMonth()!==m,closed=r?.is_closed,staff=r?.staff||{},count=Object.values(staff).filter(Boolean).length;html+=`<button class="day ${other?'other':''} ${key===today?'today':''} ${closed?'closed':''}" data-date="${key}"><span class="daynum">${d.getDate()}</span>${r?'<span class="dot"></span>':''}<span class="daystatus">${closed?'Closed':r?(count+' in'):''}</span>${r?.opener&&!closed?`<span class="opener">Opens: ${esc(r.opener)}</span>`:''}</button>`}$('#calendar').innerHTML=html;document.querySelectorAll('.day').forEach(x=>x.onclick=()=>openDay(x.dataset.date))}
function staffHtml(staff={}){return GROUPS.map(([group,names])=>`<section class="group"><h3>${group}</h3>${names.map(name=>`<div class="person"><span class="person-name">${name}</span><label class="ticklabel"><input class="incheck" type="checkbox" data-name="${name}" ${staff[name]?'checked':''}><span>In</span></label>${group==='Pot wash'?'':`<button type="button" class="openpick ${draftOpener===name?'active':''}" data-name="${name}">${draftOpener===name?'✓ Opens':'Opens'}</button>`}</div>`).join('')}</section>`).join('')}
function wireStaff(){document.querySelectorAll('.openpick').forEach(b=>b.onclick=()=>{draftOpener=draftOpener===b.dataset.name?'':b.dataset.name;if(draftOpener){const cb=document.querySelector(`.incheck[data-name="${CSS.escape(draftOpener)}"]`);if(cb)cb.checked=true}$('#staffArea').innerHTML=staffHtml(readStaff());wireStaff()})}
function readStaff(){const out={};document.querySelectorAll('.incheck').forEach(x=>out[x.dataset.name]=x.checked);return out}
function openDay(date){editingDate=date;const r=rows.get(date);draftOpener=r?.opener||'';$('#editTitle').textContent=pretty(date);$('#closed').checked=!!r?.is_closed;$('#notes').value=r?.notes||'';$('#staffArea').innerHTML=staffHtml(r?.staff||{});$('#staffArea').classList.toggle('disabled',$('#closed').checked);wireStaff();$('#editor').showModal()}
$('#closed').onchange=()=>$('#staffArea').classList.toggle('disabled',$('#closed').checked);$('#cancel').onclick=()=>$('#editor').close();
$('#save').onclick=async()=>{if(!user)return;const closed=$('#closed').checked,staff=closed?{}:readStaff(),opener=closed?null:draftOpener||null;$('#save').disabled=true;$('#save').textContent='Saving…';const value={shift_date:editingDate,is_closed:closed,staff,opener,notes:$('#notes').value.trim()||null,updated_by:user.id};const exists=rows.has(editingDate);const q=exists?await db.from('shop_staffing').update(value).eq('shift_date',editingDate):await db.from('shop_staffing').insert({...value,created_by:user.id});$('#save').disabled=false;$('#save').textContent='Save day';if(q.error){alert('Could not save: '+q.error.message);return}$('#editor').close();await loadMonth()};
$('#prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);loadMonth()};$('#next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);loadMonth()};$('#today').onclick=()=>{cursor=new Date();cursor.setDate(1);loadMonth()};
(async()=>{if(!db){$('#sync').textContent='Supabase config missing';return}const s=await db.auth.getSession();user=s.data.session?.user||null;if(!user){$('#sync').textContent='Sign in to the Team Hub first';$('#calendar').innerHTML='<div class="empty" style="grid-column:1/-1">Please sign in to Woods Team Hub, then return to Staffing.</div>';return}await loadMonth()})();
</script></body></html>
